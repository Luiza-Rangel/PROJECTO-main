<!DOCTYPE html>
<!-- Define que o documento é HTML5 -->

<html lang="pt-br">
<!-- Define o idioma da página como português do Brasil -->

<head>
    <meta charset="UTF-8">
    <!-- Permite usar acentos e caracteres especiais -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Faz o site se adaptar a telas menores (responsivo) -->

    <title>Burger Master | Login e Cadastro</title>

    <style>
        /* :root = variáveis globais de CSS (tipo "constantes") */
        :root {
            --primary-color: #e67e22; /* Cor principal (laranja) */
            --secondary-color: #2c3e50; /* Cor secundária (cinza escuro) */
            --accent-color: #f1c40f; /* Cor de destaque (amarelo) */
            --text-light: #ecf0f1; /* Cor de texto clara */
        }

        /* Estilização do corpo da página */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            /* Fundo com imagem + camada escura por cima */
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1550547660-d9450f859349?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');

            background-size: cover; /* Faz a imagem cobrir toda a tela */
            background-position: center; /* Centraliza a imagem */
            background-attachment: fixed; /* Efeito de imagem parada */

            display: flex;
            justify-content: center; /* Centraliza horizontalmente */
            align-items: center; /* Centraliza verticalmente */

            min-height: 100vh; /* Altura mínima da tela inteira */
            margin: 0;
        }

        /* Caixa principal (login/cadastro) */
        .container {
            background-color: rgba(255, 255, 255, 0.95); /* Branco com leve transparência */
            padding: 40px;
            border-radius: 15px; /* Bordas arredondadas */
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); /* Sombra */
            width: 100%;
            max-width: 400px; /* Limita largura */
            text-align: center;
        }

        /* Logo */
        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: var(--secondary-color);
            margin-bottom: 10px;
            text-transform: uppercase; /* Tudo maiúsculo */
            letter-spacing: 2px; /* Espaço entre letras */
        }

        /* Parte destacada da logo */
        .logo span {
            color: var(--primary-color);
        }

        h2 {
            color: var(--secondary-color);
            margin-bottom: 25px;
        }

        /* Agrupamento de label + input */
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;

            /* Faz o padding não aumentar o tamanho total */
            box-sizing: border-box;

            transition: border-color 0.3s;
        }

        /* Quando o input é clicado */
        input:focus {
            border-color: var(--primary-color);
            outline: none; /* Remove borda padrão do navegador */
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        /* Efeito ao passar o mouse */
        button:hover {
            background-color: #d35400;
        }

        /* Link de alternância (login/cadastro) */
        .toggle-link {
            margin-top: 20px;
            display: block;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .toggle-link b {
            color: var(--primary-color);
            cursor: pointer;
        }

        /* Classe que esconde elementos */
        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<!-- Container principal -->
<div class="container">

    <!-- Logo -->
    <div class="logo">BURGER <span>MASTER</span></div>

    <!-- FORMULÁRIO DE LOGIN -->
    <div id="login-form">
        <h2>Bem-vindo de volta!</h2>

        <!-- Formulário (não envia pra lugar nenhum ainda) -->
        <form action="#">
            <div class="form-group">
                <label for="login-user">Usuário</label>
                <input type="text" id="login-user" placeholder="Seu usuário" required>
            </div>

            <div class="form-group">
                <label for="login-pass">Senha</label>
                <input type="password" id="login-pass" placeholder="Sua senha" required>
            </div>

            <button type="submit">MATAR A FOME</button>
        </form>

        <!-- Link que troca para cadastro -->
        <a href="#" class="toggle-link" onclick="toggleForm()">
            Não tem conta? <b>Cadastre-se aqui</b>
        </a>
    </div>

    <!-- FORMULÁRIO DE CADASTRO -->
    <div id="register-form" class="hidden">
        <!-- Começa escondido por causa da classe hidden -->

        <h2>Crie sua conta</h2>

        <form action="#">
            <div class="form-group">
                <label for="reg-name">Nome Completo</label>
                <input type="text" id="reg-name" placeholder="Como te chamamos?" required>
            </div>

            <div class="form-group">
                <label for="reg-user">Usuário</label>
                <input type="text" id="reg-user" placeholder="Escolha um @usuário" required>
            </div>

            <div class="form-group">
                <label for="reg-pass">Senha</label>
                <input type="password" id="reg-pass" placeholder="Crie uma senha forte" required>
            </div>

            <button type="submit">FAZER PARTE DO CLUBE</button>
        </form>

        <!-- Link que volta para login -->
        <a href="#" class="toggle-link" onclick="toggleForm()">
            Já é de casa? <b>Faça login</b>
        </a>
    </div>
</div>

<script>
    // Função para alternar entre login e cadastro
    function toggleForm() {

        // Seleciona os dois formulários pelo ID
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        
        // Alterna a classe 'hidden' nos dois
        // Se estiver visível, esconde. Se estiver escondido, mostra
        loginForm.classList.toggle('hidden');
        registerForm.classList.toggle('hidden');
    }
</script>

</body>
</html>
